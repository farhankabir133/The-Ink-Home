name: Refresh Medium Feed Cache

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Refresh feed cache
        run: npm run update:medium-cache

      - name: Commit cache updates
        run: |
          if [[ -n "$(git status --porcelain public/data/medium-feed.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/medium-feed.json
            git commit -m "chore(feed): refresh medium cache"
            git push
          else
            echo "No cache changes to commit"
          fi
