    <!-- NOTE: The site uses the 'Marryweather' font as the single text face.
         Host the font files (WOFF2/WOFF) in /fonts or replace the URL below
         with the Gumroad-hosted URL if you have a license and a link. -->

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            // Set both serif and sans stacks to use Marryweather so all text
            // across the site renders with the same font when available.
            fontFamily: {
              sans: ['Marryweather', 'serif'],
              serif: ['Marryweather', 'serif'],
            },
            colors: {
              'ink-dark': '#1a1a1a',
              'ink-light': '#f8f8f8',
              'ink-accent': '#a38b77',
              'ink-secondary': '#6b7280',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            },
            animation: {
              fadeInUp: 'fadeInUp 0.8s ease-out forwards',
              scaleIn: 'scaleIn 0.5s ease-out forwards',
              marquee: 'marquee 30s linear infinite',
            }
          },
        },
      }
    </script>
