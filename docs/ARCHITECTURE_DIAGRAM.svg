<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 20px sans-serif; fill: #111827 }
    .label { font: 13px sans-serif; fill: #111827 }
    .muted { font: 12px sans-serif; fill: #6b7280 }
    .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; rx:10 }
    .accent { fill: #a38b77; }
    .arrow { stroke: #9ca3af; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="24" y="36" class="title">The Ink Home — Architecture</text>
  <text x="24" y="58" class="muted">Concise visual of folders, libraries, build, CI, hosting and third-party services</text>

  <!-- Browser / Client -->
  <rect x="24" y="80" width="340" height="240" class="box" />
  <text x="42" y="106" class="label">Browser / Client</text>
  <text x="42" y="128" class="muted">React SPA (TypeScript)</text>

  <g transform="translate(42,150)">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="10" y="18" class="label">/pages (routes)</text>

    <rect x="150" y="0" width="140" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="160" y="18" class="label">/components</text>

    <rect x="0" y="44" width="140" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="10" y="62" class="label">/hooks</text>

    <rect x="150" y="44" width="140" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="160" y="62" class="label">/constants</text>

    <rect x="300" y="0" width="120" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="308" y="18" class="label">index.tsx</text>

    <rect x="300" y="44" width="120" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="308" y="62" class="label">index.css</text>
  </g>

  <!-- Libraries inside client box -->
  <g>
    <rect x="24" y="330" width="340" height="120" class="box" />
    <text x="42" y="356" class="label">Runtime libraries</text>
    <text x="42" y="378" class="muted">React 19 · react-router-dom · TypeScript (dev) </text>
    <text x="42" y="398" class="muted">GSAP (animations) · Pixi.js (canvas/WebGL)</text>
    <text x="42" y="418" class="muted">Tailwind (CDN) · Google Fonts · importmap (aistudiocdn)</text>
  </g>

  <!-- Build Tooling -->
  <rect x="420" y="80" width="360" height="120" class="box" />
  <text x="440" y="106" class="label">Build & Tooling</text>
  <text x="440" y="128" class="muted">Vite · @vitejs/plugin-react · npm · Node.js</text>

  <g>
    <rect x="420" y="160" width="360" height="130" class="box" />
    <text x="440" y="186" class="label">Source / Env</text>
    <text x="440" y="208" class="muted">TypeScript sources (.tsx / .ts)</text>
    <text x="440" y="228" class="muted">vite.config.ts (base path, env injection)</text>
    <text x="440" y="248" class="muted">.env.local (GEMINI_API_KEY placeholder)</text>
  </g>

  <!-- CI / CD -->
  <rect x="820" y="80" width="360" height="220" class="box" />
  <text x="840" y="106" class="label">CI / Deployment</text>
  <text x="840" y="128" class="muted">GitHub Actions (Node 18) → Builds dist/</text>
  <text x="840" y="148" class="muted">peaceiris/actions-gh-pages writes to gh-pages branch</text>
  <text x="840" y="168" class="muted">Workflow: .github/workflows/deploy.yml</text>

  <g>
    <rect x="840" y="190" width="160" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="852" y="210" class="label">gh-pages (dist)</text>

    <rect x="1010" y="190" width="170" height="28" rx="6" fill="#f8fafc" stroke="#e6edf3" />
    <text x="1022" y="210" class="label">GitHub Pages (cdn)</text>
  </g>

  <!-- Third-party services -->
  <rect x="420" y="330" width="760" height="120" class="box" />
  <text x="440" y="356" class="label">Third-party services & runtime</text>
  <text x="440" y="378" class="muted">FormSubmit.co (contact form forwarding)</text>
  <text x="440" y="398" class="muted">Google Fonts · Tailwind CDN · aistudiocdn (importmap)</text>
  <text x="440" y="418" class="muted">Optional: SendGrid / Mailgun (if serverless chosen)</text>

  <!-- Arrows -->
  <line x1="364" y1="200" x2="420" y2="120" class="arrow" />
  <line x1="780" y1="120" x2="820" y2="120" class="arrow" />
  <line x1="980" y1="220" x2="980" y2="300" class="arrow" />
  <line x1="580" y1="450" x2="820" y2="450" class="arrow" />

  <!-- Assets / static files -->
  <rect x="24" y="470" width="340" height="100" class="box" />
  <text x="42" y="496" class="label">Assets & static</text>
  <text x="42" y="518" class="muted">/icon (favicon) · images · dist/ (built files)</text>

  <!-- Footer notes -->
  <text x="24" y="600" class="muted">Notes: This repository is a static site. No server-side application code or DB found in repo. For server-side email sending, add a serverless function and secrets.</text>

  <!-- Legend -->
  <rect x="820" y="470" width="360" height="120" class="box" />
  <text x="840" y="496" class="label">Folder / file map (examples)</text>
  <text x="840" y="518" class="muted">/pages · /components · /hooks · /constants</text>
  <text x="840" y="538" class="muted">index.html · index.tsx · index.css</text>
  <text x="840" y="558" class="muted">vite.config.ts · package.json · .github/workflows</text>
  <text x="840" y="578" class="muted">docs/ARCHITECTURE.md · docs/ARCHITECTURE_DIAGRAM.svg</text>

</svg>
