<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 22px 'Inter', sans-serif; fill: #0f172a }
    .subtitle { font: 500 13px 'Inter', sans-serif; fill: #475569 }
    .box-title { font: 600 14px 'Inter', sans-serif; fill: #111827 }
    .box-text { font: 400 12px 'Inter', sans-serif; fill: #334155 }
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx:12; filter: drop-shadow(0 6px 12px rgba(15,23,42,0.06)); }
    .accent { fill: #a38b77 }
    .arrow { stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrowhead); }
    .small { font: 400 11px 'Inter', sans-serif; fill: #64748b }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />
  <text x="48" y="48" class="title">The Ink Home — Architecture</text>
  <text x="48" y="72" class="subtitle">Frontend (folders &amp; libs) → Build &amp; CI → Hosting → Third-party services</text>

  <!-- Client area -->
  <g transform="translate(48,110)">
    <rect x="0" y="0" width="560" height="260" class="box" />
    <text x="18" y="28" class="box-title">Client / Browser (React SPA)</text>
    <text x="18" y="52" class="box-text">React 19 · TypeScript · React Router</text>

    <!-- Folder boxes -->
    <g transform="translate(18,78)">
      <rect x="0" y="0" width="240" height="36" rx="8" fill="#fff" stroke="#eef2ff" />
      <text x="12" y="24" class="box-text">/pages — route pages (Home, About, Articles, Contact)</text>

      <rect x="0" y="56" width="240" height="36" rx="8" fill="#fff" stroke="#eef2ff" />
      <text x="12" y="80" class="box-text">/components — UI components (Header, Footer, Card)</text>

      <rect x="280" y="0" width="240" height="36" rx="8" fill="#fff" stroke="#eef2ff" />
      <text x="292" y="24" class="box-text">/hooks — custom hooks (useDarkMode)</text>

      <rect x="280" y="56" width="240" height="36" rx="8" fill="#fff" stroke="#eef2ff" />
      <text x="292" y="80" class="box-text">/constants — static data (articles lists)</text>

      <rect x="0" y="120" width="520" height="36" rx="8" fill="#fff" stroke="#eef2ff" />
      <text x="12" y="144" class="box-text">index.tsx • index.html • index.css</text>
    </g>

    <!-- Runtime libs -->
    <g transform="translate(18,180)">
      <text x="12" y="28" class="small">Runtime &amp; interactive libraries:</text>
      <text x="12" y="48" class="small">GSAP (animations) • Pixi.js (canvas/WebGL) • Tailwind (CDN) • Google Fonts</text>
      <text x="12" y="68" class="small">Import map (aistudiocdn) used for runtime CDN imports</text>
    </g>
  </g>

  <!-- Build &amp; Source -->
  <g transform="translate(640,110)">
    <rect x="0" y="0" width="660" height="120" class="box" />
    <text x="18" y="28" class="box-title">Build &amp; Source</text>
    <text x="18" y="52" class="box-text">Vite (dev server &amp; build) · @vitejs/plugin-react · TypeScript</text>
    <text x="18" y="72" class="box-text">package.json • vite.config.ts (base, env injection) • .env.local</text>

    <g transform="translate(18,84)">
      <rect x="0" y="0" width="240" height="28" rx="6" fill="#fff" stroke="#eef2ff" />
      <text x="10" y="18" class="small">GEMINI_API_KEY (build env)</text>

      <rect x="280" y="0" width="340" height="28" rx="6" fill="#fff" stroke="#eef2ff" />
      <text x="290" y="18" class="small">dist/ — production output</text>
    </g>
  </g>

  <!-- CI/CD and Hosting -->
  <g transform="translate(48,400)">
    <rect x="0" y="0" width="700" height="190" class="box" />
    <text x="18" y="28" class="box-title">CI / CD</text>
    <text x="18" y="52" class="box-text">GitHub Actions: .github/workflows/deploy.yml</text>
    <text x="18" y="72" class="box-text">Node 18 · npm ci · npm run build</text>
    <text x="18" y="92" class="box-text">peaceiris/actions-gh-pages publishes ./dist to gh-pages</text>

    <rect x="420" y="16" width="260" height="28" rx="8" fill="#f8fafc" stroke="#e6edf3" />
    <text x="436" y="36" class="small">permissions: contents: write • pages: write</text>

    <!-- Hosting -->
    <g transform="translate(720,0)">
      <rect x="0" y="0" width="620" height="190" class="box" />
      <text x="18" y="28" class="box-title">Hosting / CDN</text>
      <text x="18" y="52" class="box-text">GitHub Pages (serves gh-pages branch) • URL: https://farhankabir133.github.io/The-Ink-Home/</text>
      <text x="18" y="72" class="box-text">Assets: /The-Ink-Home/assets/... (vite base)</text>
    </g>
  </g>

  <!-- Third-party services -->
  <g transform="translate(48,620)">
    <rect x="0" y="0" width="1316" height="160" class="box" />
    <text x="18" y="28" class="box-title">Third-party services &amp; notes</text>
    <text x="18" y="52" class="box-text">FormSubmit.co — contact form forwarding (one-time activation)</text>
    <text x="18" y="72" class="box-text">Google Fonts • Tailwind CDN • aistudiocdn importmap</text>
    <text x="18" y="92" class="box-text">Optional: Add serverless (Vercel/Netlify) + SendGrid/Mailgun for direct email sending</text>

    <text x="18" y="122" class="small">Note: Repository contains only static app sources — no server-side application or DB inside repo.</text>
  </g>

  <!-- Legend / folder map -->
  <g transform="translate(640,400)">
    <rect x="0" y="0" width="420" height="120" class="box" />
    <text x="18" y="28" class="box-title">Folder &amp; file map</text>
    <text x="18" y="52" class="box-text">/pages • /components • /hooks • /constants</text>
    <text x="18" y="72" class="box-text">index.html • index.tsx • index.css</text>
    <text x="18" y="92" class="box-text">vite.config.ts • package.json • .github/workflows</text>
  </g>
</svg>
